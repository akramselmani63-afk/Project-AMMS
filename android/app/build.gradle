plugins {
    id "com.android.application"
}

android {
    namespace "com.agridiam.amms"
    compileSdk 35

    defaultConfig {
        applicationId "com.agridiam.amms"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
