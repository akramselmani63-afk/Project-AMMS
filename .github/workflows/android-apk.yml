name: Build Android APK

on:
  pull_request:
    branches: [main, feat/maintenance-workflows, fix/agrimaint-security-review-2026-10-17]
    paths:
      - "previews/role-access/**"
      - "android/**"
      - "scripts/portable.js"
      - "scripts/build-notifications.js"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "styles.css"
      - "index.html"
      - "assets/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Install application dependencies
        run: npm --prefix previews/role-access ci
      - name: Verify maintenance workflows and portable page
        run: npm --prefix previews/role-access test
      - name: Build the offline agriMAINT page
        run: |
          npm --prefix previews/role-access run portable
          mkdir -p android/app/src/main/assets/www
          cp previews/role-access/AMMS-Access-Preview.html android/app/src/main/assets/www/index.html
      - name: Prepare branded Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp previews/role-access/assets/amms-pwa-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Assemble debug APK
        run: gradle --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: agriMAINT-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: previews/role-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Build Windows executable
        shell: powershell
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agriMAINT-Windows-EXE
          path: previews/role-access/dist/agriMAINT.exe
          if-no-files-found: error
          retention-days: 30
